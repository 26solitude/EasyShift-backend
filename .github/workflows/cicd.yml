name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: hojang/easyshift-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine target branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Building production image..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from=type=registry,ref=${IMAGE_NAME}:cache \
              --cache-to=type=registry,ref=${IMAGE_NAME}:cache,mode=max \
              -f Dockerfile \
              -t ${IMAGE_NAME}:prod_${IMAGE_TAG} \
              -t ${IMAGE_NAME}:latest \
              --push .
          elif [ "$TARGET_BRANCH" = "develop" ]; then
            echo "Building development image..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from=type=registry,ref=${IMAGE_NAME}:cache \
              --cache-to=type=registry,ref=${IMAGE_NAME}:cache,mode=max \
              -f Dockerfile \
              -t ${IMAGE_NAME}:dev_${IMAGE_TAG} \
              --push .
          else
            echo "Unsupported branch: $TARGET_BRANCH"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      matrix:
        include:
          - branch: main
            container: easyshift_prod
            port: 81
          - branch: develop
            container: easyshift_dev
            port: 8081
    steps:
      - name: Deploy via SSH
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ "${{ matrix.branch }}" = "main" ]; then
              TAG="latest"
            else
              TAG="dev_${{ github.sha }}"
            fi
            
            DB_URL="${{ secrets.DB_URL }}"  # or DB_URL_DEVELOP
            JWT_ISSUER="${{ secrets.JWT_ISSUER }}"
            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            
            # OAuth2
            KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}"
            KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}"
            KAKAO_REDIRECT_URI="${{ secrets.KAKAO_REDIRECT_URI }}"
            KAKAO_AUTHORIZATION_URI="${{ secrets.KAKAO_AUTHORIZATION_URI }}"
            KAKAO_TOKEN_URI="${{ secrets.KAKAO_TOKEN_URI }}"
            KAKAO_USER_INFO_URI="${{ secrets.KAKAO_USER_INFO_URI }}"
            KAKAO_SCOPE="${{ secrets.KAKAO_SCOPE }}"
            KAKAO_AUTHORIZATION_GRANT_TYPE="authorization_code"
            
            echo "Pulling image: ${{ env.IMAGE_NAME }}:$TAG"
            docker pull ${{ env.IMAGE_NAME }}:$TAG
            
            echo "Stopping and removing existing container: ${{ matrix.container }}"
            docker stop ${{ matrix.container }} || true
            docker rm ${{ matrix.container }} || true
            
            echo "Starting new container..."
            docker run -d --restart unless-stopped \
              --name ${{ matrix.container }} \
              -p 127.0.0.1:${{ matrix.port }}:${{ secrets.SERVER_PORT }} \
              --add-host=host.docker.internal:host-gateway \
              -e SERVER_PORT="${{ secrets.SERVER_PORT }}" \
              -e DB_URL="$DB_URL" \
              -e JWT_ISSUER="$JWT_ISSUER" \
              -e JWT_SECRET_KEY="$JWT_SECRET_KEY" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID="$KAKAO_CLIENT_ID" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET="$KAKAO_CLIENT_SECRET" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_REDIRECT_URI="$KAKAO_REDIRECT_URI" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_AUTHORIZATION_GRANT_TYPE="$KAKAO_AUTHORIZATION_GRANT_TYPE" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_SCOPE="$KAKAO_SCOPE" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_AUTHORIZATION_URI="$KAKAO_AUTHORIZATION_URI" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_TOKEN_URI="$KAKAO_TOKEN_URI" \
              -e SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KAKAO_USER_INFO_URI="$KAKAO_USER_INFO_URI" \
              ${{ env.IMAGE_NAME }}:$TAG