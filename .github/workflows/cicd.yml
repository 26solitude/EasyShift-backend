name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: hojang/easyshift-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine target branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Building production image..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from=type=registry,ref=${IMAGE_NAME}:cache \
              --cache-to=type=registry,ref=${IMAGE_NAME}:cache,mode=max \
              -f Dockerfile \
              -t ${IMAGE_NAME}:prod_${IMAGE_TAG} \
              -t ${IMAGE_NAME}:latest \
              --push .
          elif [ "$TARGET_BRANCH" = "develop" ]; then
            echo "Building development image..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --cache-from=type=registry,ref=${IMAGE_NAME}:cache \
              --cache-to=type=registry,ref=${IMAGE_NAME}:cache,mode=max \
              -f Dockerfile \
              -t ${IMAGE_NAME}:dev_${IMAGE_TAG} \
              --push .
          else
            echo "Unsupported branch: $TARGET_BRANCH"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      matrix:
        include:
          - branch: main
            container: easyshift_prod
            port: 81
            db_url: ${{ secrets.DB_URL }}
            oauth_config: ${{ secrets.APPLICATION_OAUTH_CONFIG_PROD }}
            tag: latest
          - branch: develop
            container: easyshift_dev
            port: 8081
            db_url: ${{ secrets.DB_URL_DEVELOP }}
            oauth_config: ${{ secrets.APPLICATION_OAUTH_CONFIG_DEV }}
            tag: dev_${{ github.sha }}
    steps:
      - name: Deploy via SSH
        if: github.ref == format('refs/heads/{0}', matrix.branch)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Deploying to ${MATRIX_BRANCH}"
            echo "Pulling image: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}"
            docker pull ${{ env.IMAGE_NAME }}:${{ matrix.tag }}

            echo "Stopping and removing container: ${{ matrix.container }}"
            docker stop ${{ matrix.container }} || true
            docker rm ${{ matrix.container }} || true

            echo "Creating OAuth config file"
            echo '${{ matrix.oauth_config }}' > /tmp/oauth_config.json

            echo "Starting new container..."
            docker run -d --restart unless-stopped \
              --name ${{ matrix.container }} \
              -p 127.0.0.1:${{ matrix.port }}:${{ secrets.SERVER_PORT }} \
              --add-host=host.docker.internal:host-gateway \
              -e SERVER_PORT="${{ secrets.SERVER_PORT }}" \
              -e DB_URL="${{ matrix.db_url }}" \
              -e DB_DRIVER="${{ secrets.DB_DRIVER }}" \
              -e DB_DIALECT="${{ secrets.DB_DIALECT }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_ISSUER="${{ secrets.JWT_ISSUER }}" \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -e APPLICATION_OAUTH_CONFIG="$(cat /tmp/oauth_config.json)" \
              ${{ env.IMAGE_NAME }}:${{ matrix.tag }}

            echo "Deployment completed for ${{ matrix.container }}"
